@if (alertData(); as alert) {
  <div
    class="toast w-full sm:max-w-md"
    [class.visible]="show()"
    [attr.data-type]="alert.type"
    [attr.role]="alert.type === 'error' ? 'alert' : 'status'"
    [attr.aria-hidden]="!show()"
    (mouseenter)="pause()"
    (mouseleave)="resume()"
    (focusin)="pause()"
    (focusout)="resume()"
  >
    <span class="inline-flex items-center justify-center shrink-0 size-8 rounded-full text-(--accent) bg-(--accent)/15" aria-hidden="true">
      @if (alert.type === 'success') {
        <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
          <path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0L3.3 9.7a1 1 0 1 1 1.4-1.4l3.8 3.8 6.8-6.8a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/>
        </svg>
      } @else {
        <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
          <path fill-rule="evenodd" d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm-1 4a1 1 0 1 1 2 0v4a1 1 0 1 1-2 0V6Zm1 8.5a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5Z" clip-rule="evenodd"/>
        </svg>
      }
    </span>

    <div class="flex-1 min-w-0 flex flex-col items-start gap-1.5 pt-1">
      <p class="text-sm font-medium leading-snug break-words">{{ alert.text }}</p>

        @if (alert.action && alert.actionText) {
        <button type="button"
            class="mt-0.5 px-3 py-1.5 rounded-md text-xs font-semibold text-(--accent) bg-(--accent)/15 hover:bg-(--accent)/25 cursor-pointer focus-visible:outline-2"
            (click)="action()">
            {{ alertData()?.actionText }}
        </button>
        }
    </div>

    <button type="button" class="grid place-items-center shrink-0 size-7 rounded-lg text-(--text-muted) hover:bg-white/10 hover:text-(--text-main) cursor-pointer" aria-label="Cerrar alerta" (click)="close()">
      <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
        <path d="M5.3 5.3a1 1 0 0 1 1.4 0L10 8.6l3.3-3.3a1 1 0 1 1 1.4 1.4L11.4 10l3.3 3.3a1 1 0 0 1-1.4 1.4L10 11.4l-3.3 3.3a1 1 0 0 1-1.4-1.4L8.6 10 5.3 6.7a1 1 0 0 1 0-1.4Z"/>
      </svg>
    </button>
  </div>
}
